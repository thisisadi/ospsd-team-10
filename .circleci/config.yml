version: 2.1

workflows:
  build_and_test:
    jobs:
      - install_workspace:
          filters:
            branches:
              only:
                - hw-3
                - main
      - lint:
          requires: [install_workspace]
      - typecheck:
          requires: [install_workspace]
      - test_all:
          requires: [install_workspace]
      - test_team9_chat_optional:
          requires: [test_all]
      - test_e2e_live_cloud_optional:
          requires: [test_all]
      - docker_build_push:
          requires: [lint, typecheck, test_all]
          filters:
            branches:
              only:
                - hw-3
                - main
      - deploy_render_hook:
          requires: [docker_build_push]
      - deploy_docs:
          requires: [test_all]
          filters:
            branches:
              only: main

jobs:
  install_workspace:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install uv and add to PATH
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            uv --version
      - run:
          name: Create venv & uv sync (workspace packages install via root deps)
          command: |
            source $BASH_ENV
            uv venv --python 3.12 --clear
            source .venv/bin/activate
            uv sync --group dev --verbose
      - run:
          name: Verify toolchain
          command: |
            source .venv/bin/activate
            uv tree
            uv run ruff --version
            uv run mypy --version
            uv run pytest --version
            uv run coverage --version
      - persist_to_workspace:
          root: .
          paths:
            - .

  lint:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Ruff (lint + format check)
          command: |
            source .venv/bin/activate
            uv run ruff check .
            uv run ruff format --check .

  typecheck:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: .
      - run:
          name: MyPy (strict)
          command: |
            source .venv/bin/activate
            uv run mypy .

  test_all:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Create results directories
          command: |
            mkdir -p test-results/all coverage-reports
      - run:
          name: Unit + integration + local E2E + coverage (enforce threshold)
          command: |
            source .venv/bin/activate
            uv run pytest \
              -m "not team9_chat and not e2e_live_cloud" \
              --junitxml=test-results/all/junit.xml \
              -v \
              --cov=vertical_adapter \
              --cov=vertical_service \
              --cov=vertical_impl \
              --cov=ai_client_api \
              --cov=openai_ai_client_impl \
              --cov=http_chat_client_impl \
              --cov=chat_client_api \
              --cov-report=term-missing \
              --cov-report=xml:coverage-reports/coverage.xml \
              --cov-report=html:coverage-reports/html \
              --cov-fail-under=84
      - store_test_results:
          path: test-results/all
      - store_artifacts:
          path: coverage-reports
          destination: coverage-reports
      - store_artifacts:
          path: test-results/all
          destination: test-results/all

  test_team9_chat_optional:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Live Team 9 chat integration (optional)
          command: |
            source .venv/bin/activate
            mkdir -p test-results/team9_chat
            if [ -n "${CHAT_SERVICE_BASE_URL}" ] && [ -n "${CHAT_SESSION_ID}" ] && [ -n "${INTEGRATION_AGENT_CHANNEL_ID}" ]; then
              uv run pytest -m "team9_chat" \
                --junitxml=test-results/team9_chat/junit.xml \
                -v --no-cov
            else
              echo "Skipping Team 9 chat (set CHAT_SERVICE_BASE_URL, CHAT_SESSION_ID, INTEGRATION_AGENT_CHANNEL_ID)."
            fi
      - store_test_results:
          path: test-results/team9_chat
      - store_artifacts:
          path: test-results/team9_chat
          destination: test-results/team9_chat

  test_e2e_live_cloud_optional:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Live cloud E2E (AWS / deployed adapter) optional
          command: |
            source .venv/bin/activate
            mkdir -p test-results/e2e_live
            if [ -n "${AWS_S3_BUCKET}" ] && [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ]; then
              uv run pytest -m "e2e_live_cloud" \
                --junitxml=test-results/e2e_live/junit.xml \
                -v --no-cov
            else
              echo "Skipping live-cloud E2E (AWS secrets not set)."
            fi
      - store_test_results:
          path: test-results/e2e_live
      - store_artifacts:
          path: test-results/e2e_live
          destination: test-results/e2e_live

  docker_build_push:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: .
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Install AWS CLI
          command: |
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
      - run:
          name: Login to ECR
          command: |
            aws ecr get-login-password --region $AWS_REGION \
            | docker login \
              --username AWS \
              --password-stdin 396608794887.dkr.ecr.us-east-1.amazonaws.com
      - run:
          name: Build image
          command: docker build -t ospsd-cloud-service .
      - run:
          name: Tag and push image
          command: |
            docker tag ospsd-cloud-service:latest \
              396608794887.dkr.ecr.us-east-1.amazonaws.com/ospsd-cloud-service:latest
            docker tag ospsd-cloud-service:latest \
              396608794887.dkr.ecr.us-east-1.amazonaws.com/ospsd-cloud-service:$CIRCLE_SHA1
            docker push \
              396608794887.dkr.ecr.us-east-1.amazonaws.com/ospsd-cloud-service:latest
            docker push \
              396608794887.dkr.ecr.us-east-1.amazonaws.com/ospsd-cloud-service:$CIRCLE_SHA1

  deploy_render_hook:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Trigger Render deploy hook (optional)
          command: |
            if [ -n "${RENDER_DEPLOY_HOOK_URL}" ]; then
              curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}"
            else
              echo "RENDER_DEPLOY_HOOK_URL not set; skipping deploy hook."
            fi

  deploy_docs:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: .
      - add_ssh_keys:
          fingerprints:
            - "SHA256:tSa6Xa2nPRsMSDw54YO2DqCgmORD4GSmB/qWL/BB5yc"
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
      - run:
          name: Deploy MkDocs to gh-pages
          command: |
            source $BASH_ENV
            uv venv --python 3.12 --clear
            source .venv/bin/activate
            uv sync --group dev --verbose
            uv run mkdocs gh-deploy --force
