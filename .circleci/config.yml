version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - checkout

      - run:
          name: Install uv and add to PATH
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            uv --version

      - run:
          name: Create venv & install deps via uv
          command: |
            source $BASH_ENV
            uv venv --python 3.12 --clear
            source .venv/bin/activate
            uv sync --all-packages --group dev --verbose

      - run:
          name: Verify toolchain
          command: |
            source .venv/bin/activate
            uv tree
            uv run ruff --version
            uv run mypy --version
            uv run pytest --version
            uv run coverage --version

      - persist_to_workspace:
          root: .
          paths:
            - .

  docker_publish:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: .
      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Install AWS CLI
          command: |
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install

      - run:
          name: Login to ECR
          command: |
            aws ecr get-login-password --region $AWS_REGION \
            | docker login \
              --username AWS \
              --password-stdin 396608794887.dkr.ecr.us-east-1.amazonaws.com

      - run:
          name: Build image
          command: docker build -t ospsd-cloud-service .

      - run:
          name: Tag image
          command: |
            docker tag ospsd-cloud-service:latest \
            396608794887.dkr.ecr.us-east-1.amazonaws.com/ospsd-cloud-service:latest

            docker tag ospsd-cloud-service:latest \
            396608794887.dkr.ecr.us-east-1.amazonaws.com/ospsd-cloud-service:$CIRCLE_SHA1

      - run:
          name: Push image
          command: |
            docker push \
            396608794887.dkr.ecr.us-east-1.amazonaws.com/ospsd-cloud-service:latest

            docker push \
            396608794887.dkr.ecr.us-east-1.amazonaws.com/ospsd-cloud-service:$CIRCLE_SHA1

  lint:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Ruff (lint + format check)
          command: |
            source .venv/bin/activate
            uv run ruff check .
            uv run ruff format --check .

  typecheck:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: .
      - run:
          name: MyPy (strict)
          command: |
            source .venv/bin/activate
            uv run mypy .

  test_unit_integration:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Create results directories
          command: |
            mkdir -p test-results/unit_integration coverage-reports

      - run:
          name: Run unit + integration tests (skip e2e)
          command: |
            source .venv/bin/activate
            uv run pytest -m "not e2e and not team9_chat" \
              --junitxml=test-results/unit_integration/junit.xml -v \
              --cov=vertical_adapter \
              --cov=vertical_service \
              --cov=vertical_impl \
              --cov-report=term-missing \
              --cov-report=xml:coverage-reports/coverage.xml \
              --cov-report=html:coverage-reports/html

      - store_test_results:
          path: test-results/unit_integration

      - store_artifacts:
          path: coverage-reports
          destination: coverage-reports

      - store_artifacts:
          path: test-results/unit_integration
          destination: test-results/unit_integration

  test_team9_chat_optional:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Create results directory
          command: |
            mkdir -p test-results/team9

      - run:
          name: Run Team 9 + agent integration test when chat env vars exist
          command: |
            source .venv/bin/activate
            if [ -z "${CHAT_SERVICE_BASE_URL:-}" ] || [ -z "${CHAT_SESSION_ID:-}" ] || [ -z "${INTEGRATION_AGENT_CHANNEL_ID:-}" ]; then
              echo "Skipping optional Team 9 chat integration test: required env vars are not configured."
              printf '%s\n' \
                '<?xml version="1.0" encoding="utf-8"?>' \
                '<testsuites>' \
                '  <testsuite name="team9_chat_optional" tests="0" failures="0" errors="0" skipped="0" />' \
                '</testsuites>' \
                > test-results/team9/results.xml
              exit 0
            fi
            echo "Team 9 chat env vars detected. Running optional team9_chat integration test..."
            uv run pytest tests/integration/test_agent_team9_integration.py -v \
              --junitxml=test-results/team9/results.xml \
              --no-cov

      - store_test_results:
          path: test-results/team9

      - store_artifacts:
          path: test-results/team9
          destination: test-results/team9

  test_e2e_optional:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Create results directory
          command: |
            mkdir -p test-results/e2e

      - run:
          name: Run e2e tests only if AWS env vars exist
          command: |
            source .venv/bin/activate
            if [ -n "${AWS_S3_BUCKET}" ] && [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ]; then
              echo "AWS env vars detected. Running e2e tests..."
              uv run pytest -m "e2e" \
                --junitxml=test-results/e2e/junit.xml -v \
                --no-cov
            else
              echo "AWS creds not set. Skipping e2e."
            fi

      - store_test_results:
          path: test-results/e2e

      - store_artifacts:
          path: test-results/e2e
          destination: test-results/e2e

  deploy_render_hook:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Trigger Render deploy hook (optional)
          command: |
            if [ -n "${RENDER_DEPLOY_HOOK_URL}" ]; then
              curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}"
            else
              echo "RENDER_DEPLOY_HOOK_URL not set in CircleCI project settings; skipping deploy hook."
            fi

  deploy_docs:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: .

      - add_ssh_keys:
          fingerprints:
            - "SHA256:tSa6Xa2nPRsMSDw54YO2DqCgmORD4GSmB/qWL/BB5yc"

      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV

      - run:
          name: Install docs dependencies
          command: |
            source $BASH_ENV
            uv venv --python 3.12 --clear
            source .venv/bin/activate
            uv sync --all-packages --group dev

      - run:
          name: Deploy MkDocs to gh-pages
          command: |
            source .venv/bin/activate
            uv run mkdocs gh-deploy --force

workflows:
  build_and_test:
    jobs:
      - build
      - lint:
          requires: [build]
      - typecheck:
          requires: [build]
      - test_unit_integration:
          requires: [build]
      - test_team9_chat_optional:
          requires: [test_unit_integration]
      - test_e2e_optional:
          requires: [test_unit_integration]
      - docker_publish:
          requires:
            - lint
            - typecheck
            - test_unit_integration
          filters:
            branches:
              only: main
      - deploy_render_hook:
          requires:
            - lint
            - typecheck
            - test_unit_integration
          filters:
            branches:
              only: main
      - deploy_docs:
          requires:
            - lint
            - typecheck
            - test_unit_integration
          filters:
            branches:
              only: main
